# m52xq (в5): resume handshake of the WCN6750 firmware after a WoW sleep (own ath11k_ahb.ko, see в5/build-ath11k-ahb): wait 5 s for the
# firmware's answer to SMP2P POWER_SAVE_EXIT and resend it twice before giving up (3 s and no resend made WPSS crash after a few sleeps)
options ath11k_ahb m52xq_resume_wait_s=5 m52xq_resume_retries=2

# убунтутач24/003 v2: plymouthd loads its graphical renderers only when the kernel command line has "splash" (ours has
# not: "Creating non-graphical devices, since renderers are being explicitly skipped", a black screen at boot); hand it
# the real command line plus "splash"
# v3 (temporary, to check the boot splash): --debug --debug-file=/run/plymouth-boot.log
[Service]
ExecStart=
ExecStart=/bin/sh -c 'exec /usr/sbin/plymouthd --mode=boot --pid-file=/run/plymouth/pid --attach-to-session --debug --debug-file=/run/plymouth-boot.log --kernel-command-line="$(cat /proc/cmdline) splash"'

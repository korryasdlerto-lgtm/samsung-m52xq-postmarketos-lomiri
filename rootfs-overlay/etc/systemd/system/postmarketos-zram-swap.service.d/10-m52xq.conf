# m52xq: the unit has "ExecCondition=sh -c ..." and systemd wants an absolute path ("Unable to locate executable 'sh'"), so the
# condition always failed and zram swap never started (no swap -> the OOM killer took the camera / keyboard while recording 4K video)
[Service]
ExecCondition=
ExecCondition=/bin/sh -c '. /usr/share/misc/source_deviceinfo'

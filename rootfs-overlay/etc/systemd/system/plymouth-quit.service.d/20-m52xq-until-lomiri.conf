# убунтутач24/003 v3: keep the boot splash until Lomiri starts. Lomiri waits for iio-sensor-proxy (tinydm drop-in
# 20-m52xq-after-sensors.conf), and between the splash leaving at "user sessions allowed" and Lomiri the text console
# with the boot messages was on the screen; the last splash frame now stays (--retain-splash) until Lomiri draws.
[Unit]
After=iio-sensor-proxy.service

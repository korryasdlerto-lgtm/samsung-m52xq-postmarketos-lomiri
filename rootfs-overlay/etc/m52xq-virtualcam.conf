# Orientation of the virtual camera (gstreamer videoflip methods: none, clockwise, counterclockwise, rotate-180,
# horizontal-flip, vertical-flip, upper-left-diagonal, upper-right-diagonal). Output is portrait 720x960.
front_method=counterclockwise
rear_method=clockwise
front_mirror=0
# 31.10: front camera upside down in landscape -> turn it by another 180 degrees there (0 = off)
front_landscape_flip=1

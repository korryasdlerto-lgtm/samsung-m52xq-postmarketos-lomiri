# m52xq (убунтутач24/003, в4): NetworkManager skips "sleep: unmanaging device" for a Wi-Fi device that has wake-on-wlan flags set
# (strings in /usr/sbin/NetworkManager: "device %s has wake-on-lan, skipping"). "ignore" does NOT count: with it wlan0 was
# deactivated (DEAUTH_LEAVING) and reconnected on every ~0.7 s dark sleep, the avahi/mDNS traffic woke the phone again at once.
# 8 = magic packet; the real WoWLAN rules (disconnect + magic + MAC pattern) are set by dispatcher.d/90-m52xq-wowlan (iw).
[connection]
wifi.wake-on-wlan=8
